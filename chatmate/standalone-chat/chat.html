<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>TalkBuddy AI Chat - Standalone</title>
  <link rel="stylesheet" href="chat.css" />
  <script defer src="chat.js"></script>
</head>
<body>
<div id="tp-chat-outer" class="tp-chat-outer light">
  <div class="tp-chat-wrap">
    <!-- Header Bar -->
    <div class="tp-header-bar">
      <span class="tp-header-title">
        <span class="bot-avatar" aria-label="Bot" title="TalkBuddy">
          <!-- Bot SVG Avatar -->
          <svg width="34" height="34" viewBox="0 0 40 40" fill="none"
               style="vertical-align: bottom; filter: drop-shadow(0 2.5px 12px #4f8cff32); animation: floatBot 2.0s infinite alternate">
            <circle cx="20" cy="20" r="18" fill="#4f8cff" stroke="#fff" stroke-width="2"/>
            <ellipse cx="20" cy="21.3" rx="11.7" ry="10.2" fill="#dae6fa"/>
            <ellipse cx="20" cy="24.8" rx="6.1" ry="3.1" fill="#bdd1f1" opacity="0.55"/>
            <circle cx="16.8" cy="19.2" r="2.1" fill="#23272f"/>
            <circle cx="23.2" cy="19.2" r="2.1" fill="#23272f"/>
            <rect x="16" y="25.7" width="8" height="2.5" rx="1.1" fill="#b7bfd8"/>
          </svg>
        </span>
        TalkBuddy <span class="tp-header-ai-sub">AI Chat</span>
      </span>
      <button class="tp-theme-toggle" id="theme-toggle"
              aria-label="Switch to dark mode" title="Light/Dark mode">
        <!-- Sun/Moon SVG toggles with JS -->
        <span id="theme-icon"></span>
      </button>
    </div>
    <!-- Chat Messages -->
    <div class="tp-chat-body" id="tp-chat-body" tabindex="0" aria-live="polite">
      <!-- Messages rendered here by JS -->
    </div>
    <!-- Error message slot -->
    <div id="tp-error-bar" class="tp-error-bar" role="alert" style="display:none;">
      <span class="tp-error-msg" id="tp-error-msg"></span>
      <button class="tp-btn tp-btn-retry" id="btn-retry">Retry</button>
      <button class="tp-btn tp-btn-clear" id="btn-reset">Reset</button>
    </div>
    <!-- Chat Input -->
    <form class="tp-chat-input-bar" id="tp-chat-input-bar" autocomplete="off">
      <textarea class="tp-input-box"
                id="tp-input"
                rows="1"
                maxLength="1200"
                placeholder="Type a message..." aria-label="Type your message"></textarea>
      <button class="tp-btn tp-btn-send" id="btn-send" type="submit" aria-label="Send message">
        <span id="send-icon">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#FFF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 2L11 13" />
            <path d="M22 2L15 22L11 13L2 9L22 2Z" />
          </svg>
        </span>
        <span id="loader" class="tp-loader" style="display:none;"></span>
      </button>
      <button class="tp-btn tp-btn-clear-alt" type="button" id="btn-clear" aria-label="Clear chat">
        <svg width="17" height="17" viewBox="0 0 20 20" fill="none"><circle cx="10" cy="10" r="9" stroke="#E87A41" stroke-width="1.4"/><path d="M7 7l6 6m0-6l-6 6" stroke="#E87A41" stroke-width="1.6" stroke-linecap="round"/></svg>
      </button>
    </form>
  </div>
</div>
</body>
</html>
